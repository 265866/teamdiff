name: Privacy

# teamdiff reads players' Riot IDs, PUUIDs and match data, so personal data must never reach the
# repository. scripts/privacy-check.sh scans every file, path, commit message and tag in HEAD's
# history, and a pull request's title and description, which a squash merge makes the
# commit on main. Findings name the place and the rule, never the match, since CI logs are public.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Privacy check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the history
        run: scripts/privacy-check.sh --history

      - name: Check the title and description
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$TITLE" "$BODY" \
            | scripts/privacy-check.sh --stdin "PR title and description"
