name: Release build

# Builds the exe, zip and checksums that a release attaches. The release workflow calls it. It also
# runs on pull requests that change what goes into the build, and by hand from the Actions tab.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit or tag to build
        type: string
        required: true
    outputs:
      version:
        description: The version that was built, such as 0.2.0
        value: ${{ jobs.build.outputs.version }}
      artifact:
        description: The name of the uploaded artifact
        value: ${{ jobs.build.outputs.artifact }}
  workflow_dispatch:
  pull_request:
    paths:
      - .cargo/**
      - .github/workflows/build-release.yml
      - Cargo.lock
      - Cargo.toml
      - LICENSE-APACHE
      - LICENSE-MIT
      - about.hbs
      - about.toml
      - assets/**
      - build.rs
      - rust-toolchain.toml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Release exe
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - run: rustup toolchain install

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-about@0.9.2

      # A clarification in about.toml that no longer applies, such as a license file whose checksum
      # changed, is only logged, and a clean run logs nothing. So any output fails the step.
      - name: Write the license notices
        shell: bash
        run: |
          status=0
          cargo about generate --locked --fail about.hbs -o "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt" 2> "$RUNNER_TEMP/about.log" || status=$?
          cat "$RUNNER_TEMP/about.log" >&2
          [ "$status" -eq 0 ] && [ ! -s "$RUNNER_TEMP/about.log" ]

      # The exe carries the notices, which `teamdiff --licenses` prints (see build.rs). Only a release,
      # which passes a ref, makes an exe that updates itself (see src/update.rs); a test build doesn't.
      - run: cargo build --release --locked
        env:
          TEAMDIFF_LICENSES: ${{ runner.temp }}\THIRD-PARTY-LICENSES.txt
          TEAMDIFF_RELEASE_BUILD: ${{ inputs.ref && '1' || '' }}

      - name: Check the exe runs without the Visual C++ runtime
        run: |
          $exe = [IO.File]::ReadAllBytes('target\release\teamdiff.exe')
          if ([Text.Encoding]::ASCII.GetString($exe).Contains('VCRUNTIME140')) {
            throw 'teamdiff.exe imports VCRUNTIME140.dll, so +crt-static from .cargo/config.toml was not applied.'
          }

      - name: Read the version
        id: version
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'teamdiff').version
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact=teamdiff-$version" >> $env:GITHUB_OUTPUT

      - name: Zip and write checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          $staging = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\teamdiff-$env:VERSION"
          Copy-Item target\release\teamdiff.exe $staging
          Copy-Item LICENSE-MIT (Join-Path $staging 'LICENSE-MIT.txt')
          Copy-Item LICENSE-APACHE (Join-Path $staging 'LICENSE-APACHE.txt')
          Compress-Archive -Path "$staging\*" -DestinationPath "dist\teamdiff-$env:VERSION-x64.zip"
          # The updater downloads the bare exe, under a name that holds the version so its attestation
          # can't pass for another release's.
          Copy-Item target\release\teamdiff.exe "dist\teamdiff-$env:VERSION-x64.exe"
          # sha256sum -c rejects lines that end in CR, so join with LF only.
          $sums = Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)`n"
          }
          [IO.File]::WriteAllText("$PWD\dist\SHA256SUMS.txt", -join $sums)
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: dist/*
          if-no-files-found: error
