name: PR

# Separate from CI so that editing a PR's title or description reruns only this.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)\([a-z0-9][a-z0-9_/-]*\)!?: [^ ].*$'
          if ! printf '%s\n' "$TITLE" | grep -Eq "$pattern"; then
            echo '::error::The PR title must look like "feat(lobby): show ranks".'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Forks don't get the secret; their titles and descriptions are still checked against every
      # pattern.
      - name: Write the denylist
        env:
          DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -z "$DENYLIST" ] && [ "$FORK" != true ]; then
            echo '::error::The PRIVACY_DENYLIST secret is missing or empty.'
            exit 1
          fi
          printf '%s\n' "$DENYLIST" > .privacy-denylist
      - name: Check the title and description for personal data
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s\n' "$TITLE" "$BODY" | scripts/privacy-check.sh --stdin "PR title and description"
