[package]
name = "teamdiff"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal companion for VALORANT on Windows: your lobby's ranks, records and recent form, and the post-game results"
repository = "https://github.com/265866/teamdiff"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["valorant", "tui", "terminal", "stats"]
categories = ["command-line-utilities", "games"]
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
crossterm = "0.29.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
unicode-width = "0.2.2"

[profile.release]
lto = true
codegen-units = 1
