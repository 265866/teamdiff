[package]
name = "teamdiff"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal companion for VALORANT on Windows: your lobby's ranks, records and recent form, and the post-game results"
repository = "https://github.com/265866/teamdiff"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["valorant", "tui", "terminal", "stats"]
categories = ["command-line-utilities", "games"]
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
crossterm = "0.29.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
unicode-width = "0.2.2"
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["net", "io-util"] }

[profile.release]
lto = true
codegen-units = 1
