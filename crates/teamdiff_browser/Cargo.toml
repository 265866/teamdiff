[package]
name = "teamdiff_browser"
description = "The hidden WebView2 browser that makes teamdiff's tracker.gg requests from the site's own page"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["io-util", "net", "rt", "sync", "time"] }
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }

[lints]
workspace = true
