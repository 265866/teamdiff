[package]
name = "teamdiff"
description = "A terminal companion for VALORANT on Windows: your lobby\u0027s ranks, records and recent form, and the post-game results."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "teamdiff"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
teamdiff_core = { path = "../teamdiff_core" }
teamdiff_live = { path = "../teamdiff_live" }
teamdiff_ui = { path = "../teamdiff_ui" }
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }

[build-dependencies]
anyhow = "1.0.104"
teamdiff_core = { path = "../teamdiff_core" }

[lints]
workspace = true
