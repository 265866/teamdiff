# Copier writes this file. `uvx copier update` reads it to update the project from trellis.
_commit: v0.17.3
_src_path: https://github.com/265866/trellis.git
architectures:
- x86_64
author: '265866'
build: {}
description: 'A terminal companion for VALORANT on Windows: your lobby''s ranks, records
    and recent form, and the post-game results.'
github_owner: '265866'
kind: binary
license: MIT OR Apache-2.0
platforms:
- windows
project_name: teamdiff
release:
    checksums: SHA256SUMS.txt
    env:
        TEAMDIFF_LICENSES: ${{ github.workspace }}/target/THIRD-PARTY-LICENSES.html
        TEAMDIFF_RELEASE_BUILD: ${{ inputs.ref && '1' || '' }}
    files:
        x86_64-pc-windows-msvc:
        - teamdiff-{version}-x64.zip
        - teamdiff-{version}-x64.exe
visibility: public
web_ui: false
