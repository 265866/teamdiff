# cargo-about writes the license notices the release build embeds in the exe, from about.hbs. A dependency
# under a license missing here fails the release build until someone checks the license allows shipping it.
# Keep this list in step with [licenses] in deny.toml.
accepted = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
